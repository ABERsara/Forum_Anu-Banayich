<div class="chat" dir="rtl">
  <header class="chat__header">
    <a routerLink="/messages">→ חזרה לחברי התא</a>
    <h1>{{ otherUserName() || 'שיחה' }}</h1>
  </header>

  <div class="chat__body" aria-live="polite" [attr.aria-busy]="isLoading()">
    @if (isLoading()) {
      <app-loading-spinner size="md" message="טוען הודעות..." />
    } @else if (hasError()) {
      <app-error-display message="אירעה שגיאה בטעינת ההודעות. נסה לרענן את הדף." />
    } @else if (messages().length === 0) {
      <p>עדיין אין הודעות. כתבו הודעה כדי להתחיל.</p>
    } @else {
      <ul class="chat__messages">
        @for (msg of messages(); track msg.id) {
          <li
            class="chat__message"
            [class.chat__message--mine]="isMyMessage(msg)"
            [class.chat__message--theirs]="!isMyMessage(msg)"
          >
            <span class="chat__bubble">{{ msg.content }}</span>
          </li>
        }
      </ul>
      <div #messagesEnd></div>
    }
  </div>

  <form class="chat__composer" (submit)="$event.preventDefault(); sendMessage()">
    @if (sendError()) {
      <app-error-display message="שליחת ההודעה נכשלה. נסו שוב." />
    }
    <div class="chat__composer-row">
      <label class="chat__composer-label" for="chat-new-message">הודעה חדשה</label>
      <input
        id="chat-new-message"
        name="newMessage"
        type="text"
        [(ngModel)]="newMessage"
        placeholder="כתבו הודעה..."
        maxlength="2000"
        [disabled]="isSending()"
      />
      <button type="submit" [disabled]="!newMessage.trim() || isSending()">שלח</button>
    </div>
  </form>
</div>
