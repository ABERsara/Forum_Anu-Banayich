<!-- No dir here: text direction follows <html dir>, which LocaleService sets
     from the active language (CONTRIBUTING §6). -->
<div class="meeting-announcement">
  <span class="meeting-announcement__badge">{{ 'meetings.announcement.badge' | transloco }}</span>

  <span class="meeting-announcement__when">
    {{
      'meetings.announcement.starts_at'
        | transloco: { when: meeting().scheduled_at | date: 'dd/MM/yyyy HH:mm' }
    }}
  </span>

  <!-- Past meeting: the button stays, disabled, and the announcement with it.
       A <button> rather than a dead anchor, because "disabled" is a state an
       anchor cannot carry — a screen reader would still offer it as a link. -->
  @if (hasEnded()) {
    <button type="button" class="meeting-announcement__join" disabled>
      {{ 'meetings.announcement.join' | transloco }}
    </button>
    <span class="meeting-announcement__ended">{{ 'meetings.announcement.ended' | transloco }}</span>
  } @else {
    <a
      class="meeting-announcement__join"
      [href]="meeting().meet_link"
      target="_blank"
      rel="noopener"
    >
      {{ 'meetings.announcement.join' | transloco }}
    </a>
  }
</div>
