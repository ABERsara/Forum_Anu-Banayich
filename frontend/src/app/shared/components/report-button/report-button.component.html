<div class="report-button">
  @if (isSubmitted()) {
    <p class="report-button__submitted">{{ 'shared.report.submitted' | transloco }}</p>
  } @else {
    <button type="button" (click)="onOpenClick()">{{ 'shared.report.button' | transloco }}</button>
  }
</div>

@if (showDialog()) {
  <div class="overlay">
    <div class="dialog">
      <h2 class="dialog__title">{{ 'shared.report.dialog_title' | transloco }}</h2>

      <div class="dialog__field">
        <label class="dialog__label" for="report-reason">
          {{ 'shared.report.reason_label' | transloco }}
        </label>
        <select
          id="report-reason"
          class="dialog__select"
          [value]="reason()"
          (change)="onReasonChange($any($event.target).value)"
        >
          @for (option of reasonOptions; track option) {
            <option [value]="option">{{ reasonLabels[option] | transloco }}</option>
          }
        </select>
      </div>

      <div class="dialog__field">
        <label class="dialog__label" for="report-description">
          {{ 'shared.report.description_label' | transloco }}
        </label>
        <textarea
          id="report-description"
          class="dialog__textarea"
          rows="3"
          [value]="description()"
          (input)="onDescriptionChange($any($event.target).value)"
        ></textarea>
      </div>

      @if (errorKey(); as key) {
        <app-error-display [message]="key | transloco" />
      }

      <div class="dialog__actions">
        <button class="btn btn--cancel" type="button" (click)="onCancel()">
          {{ 'common.cancel' | transloco }}
        </button>
        <button
          class="btn btn--primary"
          type="button"
          [disabled]="isSubmitting()"
          (click)="onSubmit()"
        >
          {{ 'shared.report.submit' | transloco }}
        </button>
      </div>
    </div>
  </div>
}
