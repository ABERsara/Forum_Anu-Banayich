<button
  [class]="classes"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  (click)="clicked.emit($event)"
>
  @if (loading()) {
    <app-loading-spinner size="sm" />
  }
  <ng-content />
</button>
