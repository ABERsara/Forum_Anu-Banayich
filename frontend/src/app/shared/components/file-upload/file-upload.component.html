<div class="file-upload">
  <input
    #fileInput
    type="file"
    [accept]="accept()"
    class="file-upload__input"
    (change)="onFileChange($event)"
  />

  <button
    type="button"
    class="file-upload__btn"
    [class.file-upload__btn--primary]="variant() === 'primary'"
    [attr.aria-label]="ariaLabel() || null"
    (click)="fileInput.click()"
  >
    {{ label() || ('shared.file_upload.choose_file' | transloco) }}
  </button>

  @if (previewUrl) {
    <div class="file-upload__preview">
      <img
        [src]="previewUrl"
        [alt]="'shared.file_upload.preview_alt' | transloco"
        class="file-upload__image"
      />
      <button type="button" class="file-upload__clear" (click)="clear(fileInput)">
        {{ 'shared.file_upload.clear' | transloco }}
      </button>
    </div>
  }

  @if (selectedFileName) {
    <div class="file-upload__preview">
      <span class="file-upload__filename">{{ selectedFileName }}</span>
      <button type="button" class="file-upload__clear" (click)="clear(fileInput)">
        {{ 'shared.file_upload.clear' | transloco }}
      </button>
    </div>
  }
</div>
