@let idleLabel = label() || ('shared.copy_text.copy' | transloco);
@let doneLabel = successLabel() || ('shared.copy_text.copied' | transloco);

<button
  type="button"
  class="copy-btn"
  [class.copy-btn--copied]="isCopied()"
  [attr.aria-label]="isCopied() ? doneLabel : idleLabel + ': ' + text()"
  [attr.aria-pressed]="isCopied()"
  (click)="copy()"
>
  <span class="copy-btn__icon" aria-hidden="true">
    @if (isCopied()) {
      <!-- Checkmark -->
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M2.5 8.5L6 12L13.5 4"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    } @else {
      <!-- Clipboard -->
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          x="5.75"
          y="1.75"
          width="8.5"
          height="10.5"
          rx="1.25"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M5.75 4.5H3.5A1.5 1.5 0 0 0 2 6v7.5A1.5 1.5 0 0 0 3.5 15h6A1.5 1.5 0 0 0 11 13.5V12.25"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    }
  </span>

  <span class="copy-btn__label">{{ isCopied() ? doneLabel : idleLabel }}</span>
</button>
